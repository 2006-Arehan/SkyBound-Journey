<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | SkyBound Journey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="bg-white/80 backdrop-blur-lg fixed top-0 left-0 right-0 z-50 shadow-sm">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold flex items-center text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
          stroke="currentColor" stroke-width="2" class="text-indigo-600 mr-2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        SkyBound Journey
      </a>
      <a href="index.html" class="bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition">Back to Home</a>
    </div>
  </header>

  <!-- SIGN-UP FORM -->
  <main class="flex-grow flex items-center justify-center py-24 px-6">
    <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-10">
      <h1 class="text-3xl font-bold text-gray-900 text-center mb-6">Create Your Account</h1>
      
      <form class="space-y-5">
        <div>
          <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
          <input type="text" id="name" placeholder="John Doe"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
        </div>

        <div>
          <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
        </div>

        <div>
          <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
          <input type="password" id="password" placeholder="Enter a password"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
        </div>

        <div>
          <label for="confirmPassword" class="block text-gray-700 font-medium mb-2">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" required>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold transition">
          Sign Up
        </button>
      </form>

      <p class="mt-6 text-center text-gray-600">Already have an account? 
        <a href="sign.html" class="text-indigo-600 hover:underline">Sign In</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white py-6 text-center">
    <p>&copy; 2025 SkyBound Journey. All rights reserved.</p>
  </footer>

</body>
</html>
