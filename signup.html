<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | SkyBound Journey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800">

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md fixed top-0 left-0 right-0 z-50 shadow-sm">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-extrabold text-gray-900 flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <span>SkyBound <span class="text-indigo-600">Journey</span></span>
      </a>
      <a href="index.html" class="bg-gray-100 text-gray-700 px-5 py-2 rounded-full hover:bg-gray-200 transition font-medium text-sm">Back to Home</a>
    </div>
  </header>

  <!-- SIGN-UP FORM -->
  <main class="flex-grow flex items-center justify-center py-28 px-6">
    <div class="bg-white shadow-xl border border-gray-100 rounded-3xl w-full max-w-md p-8 sm:p-10">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold text-2xl">✨</div>
        <h1 class="text-3xl font-extrabold text-gray-900">Create Account</h1>
        <p class="text-gray-500 text-sm mt-1">Start planning your dream Indian adventures today.</p>
      </div>
      
      <form id="signupForm" class="space-y-5">
        <div>
          <label for="name" class="block text-gray-700 font-semibold text-sm mb-2">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
        </div>

        <div>
          <label for="email" class="block text-gray-700 font-semibold text-sm mb-2">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
        </div>

        <div>
          <label for="password" class="block text-gray-700 font-semibold text-sm mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl hover:bg-indigo-700 font-bold transition shadow-lg shadow-indigo-600/30">
          Create Free Account
        </button>
      </form>

      <p class="mt-8 text-center text-gray-600 text-sm">Already have an account? 
        <a href="sign.html" class="text-indigo-600 font-semibold hover:underline">Sign In</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm">
    <p>&copy; 2026 SkyBound Journey. All rights reserved.</p>
  </footer>

  <script>
    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      localStorage.setItem('skybound_user', email);
      alert(`Account created for ${name}!`);
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
